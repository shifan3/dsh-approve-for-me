# dsh-approve-for-me bundle patch.
# The package declares this file in package.json via dsh.bundle.patch, so
# `dsh plugin --profile web add dsh-approve-for-me` (or a local path) adds
# the package to dsh.profile.bundles automatically and this row activates on
# the next boot. Users can override the config in their profile's
# cordis.patch.yml by targeting the same row id.
- insert:
    - id: approve-for-me
      name: 'dsh-approve-for-me'
      config:
        enabled: true
        provider: deepseek-official
        model: deepseek-v4-flash
        maxTokens: 512
        summaryMaxChars: 12000
        timeoutMs: 60000
